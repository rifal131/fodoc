<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#F5F5F2" />
        <meta name="description" content="FODOC — Foto Dokumentasi Universitas Mercu Buana" />
        <link rel="icon" type="image/png" href="/images/fodoc-logo.png" />
        <link rel="apple-touch-icon" href="/images/fodoc-logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <title>FODOC — Foto Dokumentasi</title>
        <script>
            window.addEventListener("error", function(e) {
                if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }, true);
        </script>

    <body class="bg-[#F5F5F2] text-[#171717] antialiased selection:bg-[#171717] selection:text-[#F5F5F2]">

        <div id="root"></div>
    </body>
